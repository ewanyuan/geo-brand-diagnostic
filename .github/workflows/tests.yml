name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements-desktop-build.txt
      - name: Use the runner's installed Chrome for browser fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/geo-bin"
          ln -s "$(command -v google-chrome)" "$RUNNER_TEMP/geo-bin/chromium"
          echo "$RUNNER_TEMP/geo-bin" >> "$GITHUB_PATH"
      - name: Test isolated product and browser behavior
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript
        run: |
          node --check static/app.js
          node --test tests/test_login_live.js
